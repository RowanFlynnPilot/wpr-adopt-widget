name: Featured Pet Snapshot

# Renders ONE long-stay adoptable pet to a PNG for the daily email
# newsletters (email clients strip the live iframe widget, so a static
# image is the only reliable embed). Reads the pet-data.json committed by
# the main "Scrape Pets" workflow — it does not re-scrape.
#
# Two editions a day so the morning and afternoon newsletters feature
# different animals:
#   11:00 UTC = 6 AM CDT (5 AM CST) — AM edition
#   21:00 UTC = 4 PM CDT (3 PM CST) — PM edition
on:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: featured-pet
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # Pull BEFORE npm install: node_modules is committed to this repo, so
      # `npm install` dirties tracked files and a later rebase refuses to run.
      - run: git pull --rebase origin main
      - run: npm install
      - run: npx puppeteer browsers install chrome
      # ANTHROPIC_API_KEY enables the Claude bio rewrite (long shelter bios are
      # condensed to <=300 chars). Without it the card falls back to a
      # sentence-boundary excerpt — the snapshot still builds either way.
      - run: node build-featured-pet.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit and push
        run: |
          git config user.name "WPR Pet Bot"
          git config user.email "bot@wausaupilotandreview.com"
          git add docs/snapshots featured-history.json
          if ! git diff --cached --quiet; then
            git commit -m "🖼️ Featured pet snapshot"
            # --autostash: npm install leaves tracked node_modules churn we
            # don't want to commit, and a plain rebase aborts on a dirty tree
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No snapshot changes."
          fi

name: Scrape Pets
on:
  schedule:
    # Run twice daily at 8 AM and 8 PM Central Time
    # 13:00 UTC = 8 AM CDT (7 AM CST during winter)
    # 01:00 UTC = 8 PM CDT previous day (7 PM CST during winter)
    - cron: '0 13 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
# Never run two scrapes at once — overlapping runs would race on the git push
concurrency:
  group: scrape-pets
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: npm install
      - run: npx puppeteer browsers install chrome
      # Petfinder official API activates when these secrets are configured
      # (free key: https://www.petfinder.com/developers); HTML scraping
      # remains the fallback either way.
      - run: node build-widget-data.js
        env:
          PETFINDER_API_KEY: ${{ secrets.PETFINDER_API_KEY }}
          PETFINDER_API_SECRET: ${{ secrets.PETFINDER_API_SECRET }}
      - name: Push results
        run: |
          git config user.name "WPR Pet Bot"
          git config user.email "bot@wausaupilotandreview.com"
          mkdir -p docs
          cp pet-data.json docs/pet-data.json
          # Mirror widget HTML + logos into docs/ so GitHub Pages always serves
          # the latest version. Root files are the source of truth.
          cp adopt-widget.html docs/adopt-widget.html
          cp -r logos docs/
          date -u > docs/update-log.txt
          git add -A
          git commit -m "🐾 Update pet data" || true
          # Rebase instead of force-push so a manual commit landed mid-run isn't clobbered.
          # --autostash guards against a dirty tree (node_modules is tracked in
          # this repo, so npm install can leave churn behind).
          git pull --rebase --autostash origin main
          git push origin main
      # Diagnostic page snapshots (saved when a scrape looks wrong) are kept as
      # a short-lived artifact instead of being committed to the repo.
      - name: Upload diagnostic snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-snapshots
          path: diag/
          retention-days: 7
          if-no-files-found: ignore
      # Runs AFTER the push so healthy shelters still publish; a failed or
      # stale shelter turns the run red and triggers the alert step below.
      - name: Health check
        run: node check-scrape-health.js
      - name: Alert — open issue when scrapes fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pet scraper failure: one or more shelters need attention"
          EXISTING=$(gh issue list --state open --search "Pet scraper failure in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Open alert issue #$EXISTING already exists — not creating another."
            exit 0
          fi
          DETAILS=$(node check-scrape-health.js 2>&1 || true)
          gh issue create --title "$TITLE" --body "The scheduled scrape run failed its health check.

          \`\`\`
          $DETAILS
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the \`diag-snapshots\` artifact on the run to see what the blocked pages returned. This issue was opened automatically by the scrape workflow; it closes itself once a later run is healthy again."
      # The mirror image of the alert above, and the reason it can be trusted:
      # the alert step refuses to open a second issue while one is already open,
      # so without this an alert nobody closed by hand would silently suppress
      # every future outage alert (issue #3 did exactly that for ~2 weeks).
      - name: Resolve — close the alert issue once scrapes are healthy
        # Only after every step above passed, health gate included.
        if: success()
        # A hiccup here must never fail the run: a red run would be misleading,
        # and the alert step sits earlier in the job, so failing after it has
        # been skipped cannot re-open an issue either way.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Match on BOTH the alert title and bot authorship so an issue a
          # human filed is never auto-closed. Listing and filtering locally
          # beats `--search`, which is eventually consistent and can miss a
          # recently opened issue.
          NUMS=$(gh issue list --state open --limit 100 --json number,title,author \
            --jq '.[] | select(.author.login | test("github-actions")) | select(.title | startswith("Pet scraper failure")) | .number')
          if [ -z "$NUMS" ]; then
            echo "No open scraper alert issue — nothing to close."
            exit 0
          fi
          for N in $NUMS; do
            echo "Scrapes are healthy again — closing alert issue #$N."
            gh issue comment "$N" --body "All shelter scrapes are healthy again, so this alert is resolved. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — closed automatically by the scrape workflow."
            gh issue close "$N"
          done

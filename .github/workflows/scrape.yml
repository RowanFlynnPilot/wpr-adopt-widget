name: Scrape Pets
on:
  schedule:
    # Run twice daily at 8 AM and 8 PM Central Time
    # 13:00 UTC = 8 AM CDT (7 AM CST during winter)
    # 01:00 UTC = 8 PM CDT previous day (7 PM CST during winter)
    - cron: '0 13 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ls -la
      - run: cat package.json
      - run: npm install
      - run: npx puppeteer browsers install chrome
      - run: node build-widget-data.js
      - name: Push results
        run: |
          git config user.name "WPR Pet Bot"
          git config user.email "bot@wausaupilotandreview.com"
          mkdir -p docs
          cp pet-data.json docs/pet-data.json
          date -u > docs/update-log.txt
          git add -A
          git commit -m "🐾 Update pet data" || true
          git push --force origin main

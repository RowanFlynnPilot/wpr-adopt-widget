name: Scrape Pets
on:
  schedule:
    # Run twice daily at 8 AM and 8 PM Central Time
    # 13:00 UTC = 8 AM CDT (7 AM CST during winter)
    # 01:00 UTC = 8 PM CDT previous day (7 PM CST during winter)
    - cron: '0 13 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
# Never run two scrapes at once — overlapping runs would race on the git push
concurrency:
  group: scrape-pets
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: npm install
      - run: npx puppeteer browsers install chrome
      # Petfinder official API activates when these secrets are configured
      # (free key: https://www.petfinder.com/developers); HTML scraping
      # remains the fallback either way.
      - run: node build-widget-data.js
        env:
          PETFINDER_API_KEY: ${{ secrets.PETFINDER_API_KEY }}
          PETFINDER_API_SECRET: ${{ secrets.PETFINDER_API_SECRET }}
      - name: Push results
        run: |
          git config user.name "WPR Pet Bot"
          git config user.email "bot@wausaupilotandreview.com"
          mkdir -p docs
          cp pet-data.json docs/pet-data.json
          # Mirror widget HTML + logos into docs/ so GitHub Pages always serves
          # the latest version. Root files are the source of truth.
          cp adopt-widget.html docs/adopt-widget.html
          cp -r logos docs/
          date -u > docs/update-log.txt
          git add -A
          git commit -m "🐾 Update pet data" || true
          # Rebase instead of force-push so a manual commit landed mid-run isn't clobbered
          git pull --rebase origin main
          git push origin main
      # Runs AFTER the push so healthy shelters still publish; a failed or
      # stale shelter turns the run red and triggers the alert step below.
      - name: Health check
        run: node check-scrape-health.js
      - name: Alert — open issue when scrapes fail
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Pet scraper failure: one or more shelters need attention"
          EXISTING=$(gh issue list --state open --search "Pet scraper failure in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Open alert issue #$EXISTING already exists — not creating another."
            exit 0
          fi
          DETAILS=$(node check-scrape-health.js 2>&1 || true)
          gh issue create --title "$TITLE" --body "The scheduled scrape run failed its health check.

          \`\`\`
          $DETAILS
          \`\`\`

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Check the \`docs/diag-*.html\` snapshots to see what the blocked pages returned. This issue was opened automatically by the scrape workflow; close it once scrapes are healthy again."
